<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artist Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth} body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:white}
.navbar{background:rgba(0,0,0,.6);backdrop-filter:blur(10px)} .navbar-brand,.title{color:#ffcc70!important}
.glass{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:20px;padding:25px}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1200');background-size:cover}
.btn-custom{background:#ffcc70;border-radius:30px;padding:12px 30px}.gallery img{width:100%;height:250px;object-fit:cover;border-radius:15px}
section{padding:80px 0}.dark-mode{background:#f5f5f5!important;color:#000!important}.dark-mode .glass,.dark-mode footer{color:black}.dark-mode .glass{background:rgba(0,0,0,.08)}
.rating{direction:rtl;display:inline-flex}.rating input{display:none}.rating label{font-size:35px;color:lightgray}.rating input:checked~label,.rating label:hover,.rating label:hover~label{color:gold}
</style></head><body>
<nav class="navbar navbar-expand-lg sticky-top"><div class="container"><a class="navbar-brand">🎨 ArtistHub</a><div class="ms-auto"><button id="themeBtn" class="btn btn-outline-warning">🌙 Dark Mode</button></div></div></nav>
<section class="hero"><div><h1>Creative Artist</h1><p>Turning imagination into beautiful art.</p></div></section>
<section><div class="container"><h2 class="title">Pricing Plans</h2><div class="row g-4"><div class="col-md-4"><div class="glass text-center"><h3>Basic</h3><h2>₹999</h2></div></div><div class="col-md-4"><div class="glass text-center border border-warning border-3"><h5>⭐ Most Popular</h5><h3>Premium</h3><h2>₹2999</h2></div></div><div class="col-md-4"><div class="glass text-center"><h3>Professional</h3><h2>₹5999</h2></div></div></div></div></section>
<section><div class="container"><h2 class="title">FAQs</h2><div class="accordion" id="a"><div class="accordion-item"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#q1">Do you accept custom orders?</button><div id="q1" class="accordion-collapse collapse show"><div class="accordion-body">Yes.</div></div></div></div></div></section>
<section><div class="container"><h2 class="title">Blog</h2><div class="row"><div class="col-md-4"><div class="glass"><h4>Creativity Tips</h4><button class="btn btn-custom">Read More</button></div></div></div></div></section>
<footer class="text-center p-4 bg-dark">© 2026 ArtistHub<div class="rating"><input type="radio" id="s5" name="r"><label for="s5">★</label><input type="radio" id="s4" name="r"><label for="s4">★</label><input type="radio" id="s3" name="r"><label for="s3">★</label><input type="radio" id="s2" name="r"><label for="s2">★</label><input type="radio" id="s1" name="r"><label for="s1">★</label></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>themeBtn.onclick=()=>{document.body.classList.toggle('dark-mode');themeBtn.innerHTML=document.body.classList.contains('dark-mode')?'☀️ Light Mode':'🌙 Dark Mode';}</script></body></html>
